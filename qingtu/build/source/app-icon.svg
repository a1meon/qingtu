    <filter id="lift" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="18"/>
      <feOffset dy="14" result="b"/>
      <feComponentTransfer><feFuncA type="linear" slope=".45"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="184.5" fill="none" stroke="url(#rim)" stroke-width="3"/>
  <rect x="294" y="294" width="352" height="352" rx="70" fill="none" stroke="#f4f4f6" stroke-width="50"/>
  <rect x="418" y="418" width="312" height="312" rx="62" fill="url(#blue)" filter="url(#lift)"/>
  <path d="M480 418 H668 A62 62 0 0 1 730 480" fill="none" stroke="#ffffff" stroke-opacity=".22" stroke-width="4"/>
</svg>
