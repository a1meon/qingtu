name: Verify and replace the published 0.5.0 builds
on:
  push:
    branches: ['codex/refresh-v050-assets']
permissions:
  contents: read
concurrency:
  group: qingtu-formal-release
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify and install the exact published Windows build
        shell: pwsh
        run: |
          $name = 'Qingtu-0.5.0-win-x64.exe'
          $expected = (Get-Content .github/v050-replacement.sha256 | Where-Object { $_.EndsWith("  $name") }).Substring(0,64)
          $installer = Join-Path $env:RUNNER_TEMP $name
          curl.exe -fLsS --retry 4 --max-time 1200 "https://cnb.cool/a1meon/qingtu/-/releases/download/v0.5.0/$name" -o $installer
          if ($LASTEXITCODE -ne 0 -or (Get-FileHash $installer).Hash -ne $expected) { throw 'Installer checksum mismatch' }
          $dest = Join-Path $env:RUNNER_TEMP 'QingtuSmoke'
          $setup = Start-Process $installer -ArgumentList "/S /D=$dest" -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "Installer exited $($setup.ExitCode)" }
          ./qingtu/scripts/test-windows-single-instance.ps1 -Executable (Join-Path $dest '轻图.exe')
  mirror:
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
        working-directory: qingtu
      - name: Validate the signed replacement before editing the release
        run: |
          set -euo pipefail
          out=qingtu/release/v0.5.0
          mkdir -p "$out"
          awk '{print $2}' .github/v050-replacement.sha256 | xargs -P 4 -I{} curl -fLsS --retry 4 --max-time 1200 'https://cnb.cool/a1meon/qingtu/-/releases/download/v0.5.0/{}' -o "$out/{}"
          (cd "$out" && sha256sum --check ../../../.github/v050-replacement.sha256)
          cd qingtu && node scripts/verify-full-release.cjs
      - name: Replace only the authorized original build in release 0.5.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib, subprocess
          def sums(f):
              return {n:h for h,n in (l.split() for l in pathlib.Path(f).read_text().splitlines())}
          old, new = (sums('.github/v050-'+s+'.sha256') for s in ('original','replacement'))
          release=json.loads(subprocess.check_output(['gh','api','repos/a1meon/qingtu/releases/tags/v0.5.0']))
          assert str(release['id'])=='454546415' and not release['draft'] and not release['prerelease']
          existing={a['name']:a['digest'].removeprefix('sha256:') for a in release['assets']}
          assert set(old)==set(new) and set(existing)<=set(new)
          assert all(h in {old[n], new[n]} for n,h in existing.items())
          for n in sorted(new, key=lambda n:(n.startswith('SHA256'), n.endswith(('.yml','.json')), n)):
              if existing.get(n)!=new[n]:
                  subprocess.run(['gh','release','upload','v0.5.0','qingtu/release/v0.5.0/'+n,'--clobber'],check=True)
          PY
          gh release edit v0.5.0 --notes-file qingtu/docs/releases/v0.5.0.md
      - name: Check every anonymous download on both sources
        run: npm run release:mirror -- v0.5.0 --verify-only
        working-directory: qingtu
